name: Generate portfolio PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'portfolio.js'
      - 'generate-pdf.js'
      - '1715654961528.jpeg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install PDF export dependency
        run: npm install --no-save puppeteer
      - name: Generate portfolio PDF
        run: node generate-pdf.js
      - uses: actions/upload-artifact@v5
        with:
          name: portfolio-pdf
          path: Muhammad-Tahir-Korejo-CV.pdf
      - name: Commit PDF
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Muhammad-Tahir-Korejo-CV.pdf
          git diff --staged --quiet || git commit -m "Update printable portfolio PDF"
          git push
